[package]
name = "termink"
version = "0.1.0"
edition = "2021"

# the app binary, and so the Dock and menu name in dev, is always "TermInk"
[[bin]]
name = "TermInk"
path = "src/main.rs"

[lib]
name = "termink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSAnimationContext", "NSAnimation"] }
objc2 = "0.6"
